# Weather location override for the waybar weather module (weather.sh).
#
# By default the module geolocates using your public IP (via ip-api.com),
# which can be wrong if you're on a VPN or an ISP that resolves you to
# another city.
#
# To force a fixed location, uncomment ONE block below (remove the leading #
# from its three lines). Keep the other blocks commented so you can quickly
# swap between saved cities later. Leave everything commented to fall back
# to automatic IP geolocation.

NAME="San Cristobal de las Casas"
LAT="16.7370"
LON="-92.6376"

#NAME="Guadalajara"
#LAT="20.6597"
#LON="-103.3496"
