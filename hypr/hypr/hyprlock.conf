source = ~/.config/omarchy/current/theme/hyprlock.conf
 
general {
    ignore_empty_input = true
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


# --- LEFT COLUMN ---

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

# Saludo dinámico + usuario
label {
    monitor =
    text = cmd[update:60000] hour=$(date +%H); if [ "$hour" -ge 6 ] && [ "$hour" -lt 12 ]; then greet="Buenos días"; elif [ "$hour" -ge 12 ] && [ "$hour" -lt 19 ]; then greet="Buenas tardes"; else greet="Buenas noches"; fi; echo "${greet}, <b>$USER</b>"
    color = $font_color
    font_size = 20
    font_family = FiraCode Nerd Font Mono
    position = -200, 265
    halign = center
    valign = center
    zindex = 2
}

# Hostname
label {
    monitor =
    text = cmd[update:3600000] echo "󰟀  $HOSTNAME"
    color = $placeholder_color
    font_size = 13
    font_family = FiraCode Nerd Font Mono
    position = -200, 210
    halign = center
    valign = center
    zindex = 2
}

# Password input
input-field {
    monitor =
    size = 320, 65
    outline_thickness = 0
    dots_size = 0.28
    dots_spacing = 0.45
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $outer_color
    font_color = $color
    check_color = $check_color
    fail_color = rgba(243, 139, 168, 1)
    fail_text = <i>$FAIL</i>
    fade_on_empty = false
    placeholder_text =  <span> password 󰈷 </span>
    placeholder_color = $placeholder_color
    hide_input = false
    rounding = 16
    position = -200, 120
    halign = center
    valign = center
    zindex = 2
}

# Error de autenticación
label {
    monitor =
    text = $FAIL
    color = rgba(243, 139, 168, 0.85)
    font_size = 12
    font_family = FiraCode Nerd Font Mono
    position = -200, 55
    halign = center
    valign = center
    zindex = 2
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = $font_color
    font_size = 72
    font_family = FiraCode Nerd Font Mono
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /  UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = $placeholder_color
    font_size = 14
    font_family = FiraCode Nerd Font Mono
    position = -260, -195
    halign = center
    valign = center
    zindex = 2
}


# --- RIGHT COLUMN ---

# PROFILE CARD — Clima + Fecha
shape {
    monitor =
    size = 360, 380
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

# Temperatura (grande)
label {
    monitor =
    text = cmd[update:300000] ~/.config/hypr/weather.sh
    color = $font_color
    font_size = 52
    font_family = FiraCode Nerd Font Mono
    position = 200, 285
    halign = center
    valign = center
    zindex = 2
}

# Descripción del clima
label {
    monitor =
    text = cmd[update:300000] ~/.config/hypr/weather.sh desc
    color = $placeholder_color
    font_size = 13
    font_family = FiraCode Nerd Font Mono
    position = 200, 228
    halign = center
    valign = center
    zindex = 2
}

# Día de la semana
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = $font_color
    font_size = 38
    font_family = FiraCode Nerd Font Mono
    position = 200, 162
    halign = center
    valign = center
    zindex = 2
}

# Fecha completa
label {
    monitor =
    text = cmd[update:1000] date +"%d %B, %Y"
    color = $placeholder_color
    font_size = 14
    font_family = FiraCode Nerd Font Mono
    position = 200, 105
    halign = center
    valign = center
    zindex = 2
}

# SYSTEM/MEDIA STATUS CARD
shape {
    monitor =
    size = 360, 320
    color = $inner_color
    rounding = 25
    position = 200, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
    zindex = 10
}

# Media Info

# Título
label {
    monitor =
    text = cmd[update:2000] title=$(playerctl metadata xesam:title 2>/dev/null | cut -c1-28); if [ -z "$title" ]; then echo "Sin música"; else echo "<b>$title</b>"; fi
    color = $font_color
    font_size = 15
    font_family = FiraCode Nerd Font Mono
    position = 200, -18
    halign = center
    valign = center
    zindex = 11
}

# Artista
label {
    monitor =
    text = cmd[update:2000] playerctl metadata xesam:artist 2>/dev/null | cut -c1-32
    color = $placeholder_color
    font_size = 12
    font_family = FiraCode Nerd Font Mono
    position = 200, -42
    halign = center
    valign = center
    zindex = 11
}

# Álbum
label {
    monitor =
    text = cmd[update:2000] album=$(playerctl metadata xesam:album 2>/dev/null | cut -c1-30); [ -n "$album" ] && echo "󰀥  $album"
    color = $placeholder_color
    font_size = 11
    font_family = FiraCode Nerd Font Mono
    position = 200, -62
    halign = center
    valign = center
    zindex = 11
}

# Barra de progreso
label {
    monitor =
    text = cmd[update:2000] pos=$(playerctl position 2>/dev/null); dur=$(playerctl metadata mpris:length 2>/dev/null); [ -n "$pos" ] && [ -n "$dur" ] && python3 -c "p,d=$pos,$dur/1000000; w=22; f=round(p/d*w) if d>0 else 0; print(f'{int(p)//60}:{int(p)%60:02d}  {chr(0x2501)*f}{chr(0x2500)*(w-f)}  {int(d)//60}:{int(d)%60:02d}')" || echo ""
    color = $placeholder_color
    font_size = 11
    font_family = FiraCode Nerd Font Mono
    position = 200, -92
    halign = center
    valign = center
    zindex = 11
}

# Battery
shape {
    monitor =
    size = 320, 120
    color = $outer_color
    rounding = 25
    position = 200, -230
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:5000] cap=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); st=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$st" = "Charging" ] || [ "$st" = "Full" ]; then icon="󰂄"; elif [ "$cap" -ge 90 ] 2>/dev/null; then icon="󰁹"; elif [ "$cap" -ge 80 ] 2>/dev/null; then icon="󰂂"; elif [ "$cap" -ge 60 ] 2>/dev/null; then icon="󰂀"; elif [ "$cap" -ge 40 ] 2>/dev/null; then icon="󰁽"; elif [ "$cap" -ge 20 ] 2>/dev/null; then icon="󰁻"; else icon="󰁺"; fi; echo "${icon}  <b>${cap}%</b>"
    color = $color
    font_size = 38
    font_family = FiraCode Nerd Font Mono
    position = 200, -218
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:5000] st=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); case "$st" in Charging) echo "Cargando" ;; Full) echo "Carga completa" ;; Discharging) echo "Usando batería" ;; "Not charging") echo "Conectado" ;; *) echo "$st" ;; esac
    color = $color
    font_size = 13
    font_family = FiraCode Nerd Font Mono
    position = 200, -262
    halign = center
    valign = center
    zindex = 12
}

