# MACHINE-SPECIFIC — edit monitor names and positions for your hardware before rebooting.
# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# 1x setup for 1080p displays
env = GDK_SCALE,1

# Laptop screen — top, primary (0x0)
monitor = eDP-1, 1920x1080@60, 0x0, 1

# ARZOPA external monitor — below laptop (0x1080)
monitor = DP-2, 1920x1080@60, 0x1080, 1
